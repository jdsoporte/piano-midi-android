name: Sondeo de SoundFonts (solo lectura)
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe-sf2.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar fluid-soundfont-gm y mostrar licencia
        run: |
          sudo apt-get update -qq
          apt-cache policy fluid-soundfont-gm | head -4
          sudo apt-get install -y -qq fluid-soundfont-gm
          ls -l /usr/share/sounds/sf2/ || true
          echo "===== COPYRIGHT ====="
          cat /usr/share/doc/fluid-soundfont-gm/copyright
          echo "===== LEEME ====="
          ls /usr/share/doc/fluid-soundfont-gm/
          zcat /usr/share/doc/fluid-soundfont-gm/README.Debian.gz 2>/dev/null | head -40 || true
      - name: Otros paquetes de sonido disponibles
        run: |
          apt-cache search soundfont | head -30
