name: Compilar APK
on:
  push:
    branches: ['claude/**']
    paths-ignore:
      - '.github/workflows/inspect-samples.yml'
      - '.github/workflows/probe-tools.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar APK (debug)
        run: gradle --no-daemon :app:assembleDebug
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: piano-midi-apk
          path: app/build/outputs/apk/debug/*.apk
