name: Compilar APK
on:
  push:
    branches: ['claude/**']
    paths-ignore:
      - '.github/workflows/inspect-samples.yml'
      - '.github/workflows/probe-tools.yml'
  workflow_dispatch:
jobs:
  test-motor:
    name: Pruebas del motor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar y correr pruebas
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -fsanitize=address,undefined \
            -o engine_test tests/engine_test.cpp app/src/main/cpp/engine.cpp \
            app/src/main/cpp/master.cpp app/src/main/cpp/sf_engine.cpp
          ./engine_test
  build:
    name: Compilar APK
    needs: test-motor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar sonidos (Salamander Grand Piano V3, CC BY 3.0)
        run: |
          pip install numpy soundfile
          git clone --depth 1 https://github.com/sfzinstruments/SalamanderGrandPiano "$RUNNER_TEMP/salamander"
          python3 tools/convert_samples.py "$RUNNER_TEMP/salamander/Samples" app/src/main/assets/piano
          du -sh app/src/main/assets/piano
      - name: Preparar FluidR3 GM (licencia MIT, paquete fluid-soundfont-gm de Ubuntu)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fluid-soundfont-gm
          grep -q "MIT license" /usr/share/doc/fluid-soundfont-gm/copyright
          grep -n "MIT license" /usr/share/doc/fluid-soundfont-gm/copyright
          mkdir -p app/src/main/assets/sf2
          cp /usr/share/sounds/sf2/FluidR3_GM.sf2 app/src/main/assets/sf2/FluidR3_GM.sf2
          ls -l app/src/main/assets/sf2
      - name: Compilar APK (debug)
        run: gradle --no-daemon :app:assembleDebug
      - name: Tamaño del APK
        run: ls -l app/build/outputs/apk/debug/*.apk
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: piano-midi-apk
          path: app/build/outputs/apk/debug/*.apk
          compression-level: 0
          retention-days: 14
