name: Inspeccionar Salamander (solo lectura)
# ejecucion 3
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/inspect-samples.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Salamander (público)
        run: |
          git lfs install || true
          git clone --depth 1 https://github.com/sfzinstruments/SalamanderGrandPiano salamander
          cd salamander && ls -la && cat .gitattributes && git lfs ls-files | head -5 || true
      - name: Resumen del SFZ
        working-directory: salamander
        run: |
          f="Salamander Grand Piano V3.sfz"
          echo "== tamaño sfz: $(wc -c < "$f") bytes, $(wc -l < "$f") líneas"
          echo "== primeras 80 líneas"; head -80 "$f"
          echo "== opcodes usados (conteo)"
          grep -oE '[a-z_0-9]+=' "$f" | sort | uniq -c | sort -rn | head -60
          echo "== <group> y <control> y <global> y <master>"
          grep -nE '^<(control|global|master|group|curve)' "$f" | head -60
      - name: Muestras
        working-directory: salamander
        run: |
          echo "== carpetas"; find . -maxdepth 3 -type d | head -30
          echo "== cantidad y tamaño de FLAC"
          find . -name '*.flac' | wc -l; du -sh Samples 2>/dev/null || du -sh .
          echo "== ejemplos de nombres"; find . -name '*.flac' | sort | head -40
          echo "== primer FLAC"; f=$(find . -name '*.flac' | head -1); head -c 64 "$f" | xxd | head -4
      - name: Mapeo de notas (Data) y resto del SFZ
        working-directory: salamander
        run: |
          ls -la Data
          echo "== SFZ líneas 84-120"; sed -n '84,120p' "Salamander Grand Piano V3.sfz"
          echo "== notes.txt"; cat Data/notes.txt | head -120
          echo "== tune_nat.txt (inicio)"; head -30 Data/tune_nat.txt
          echo "== nombres que NO son NotaNvN"
          find Samples -name '*.flac' -printf '%f\n' | grep -vE '^[A-G]#?[0-9]v[0-9]+\.flac$' | sort | head -80
          echo "== notas distintas con velocidad"
          find Samples -name '*v1.flac' -printf '%f\n' | sort | tr '\n' ' '
          echo; echo "== propiedades del primer FLAC"
          sudo apt-get install -y -qq flac >/dev/null 2>&1; metaflac --show-sample-rate --show-bps --show-channels --show-total-samples Samples/A0v1.flac Samples/C4v8.flac 2>&1 || true
